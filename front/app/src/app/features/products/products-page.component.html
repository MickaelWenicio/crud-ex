<section class="page-grid">
  <mat-card>
    <div class="card-header">
      <h2>Lista de Produtos</h2>
      <button *ngIf="isAdmin" mat-flat-button color="primary" type="button" (click)="openCreateModal()">
        Novo Produto
      </button>
    </div>

    <div class="table-filters">
      <mat-form-field appearance="outline">
        <mat-label>Buscar produto</mat-label>
        <input matInput [(ngModel)]="filterTerm" (input)="onFilterChange()" placeholder="Digite o nome do produto" />
      </mat-form-field>

      <button class="filter-clear-btn" mat-stroked-button type="button" (click)="clearFilter()">Limpar</button>
    </div>

    <table mat-table [dataSource]="products" class="table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descricao</th>
        <td mat-cell *matCellDef="let row">
          <span
            #descriptionText
            class="description-text"
            [attr.data-product-id]="row.id"
            [matTooltip]="row.description || 'Sem descricao'"
            [matTooltipDisabled]="!isDescriptionTruncated(row.id)"
            matTooltipPosition="above"
          >
            {{ row.description || '-' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="salePrice">
        <th mat-header-cell *matHeaderCellDef>Preco</th>
        <td mat-cell *matCellDef="let row">R$ {{ row.salePrice }}</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Estoque</th>
        <td mat-cell *matCellDef="let row">{{ row.stock }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button *ngIf="isAdmin" mat-icon-button color="primary" (click)="openEditModal(row)">
            <mat-icon>edit</mat-icon>
          </button>

          <button *ngIf="isAdmin" mat-icon-button color="warn" (click)="remove(row)">
            <mat-icon>delete</mat-icon>
          </button>

          <button mat-icon-button color="accent" (click)="viewImages(row)">
            <mat-icon>photo_library</mat-icon>
          </button>

          <label *ngIf="isAdmin" class="upload-label">
            <mat-icon>upload</mat-icon>
            <input type="file" multiple (change)="onUploadImages(row, $event)" />
          </label>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">Nenhum item encontrado.</td>
      </tr>
    </table>
  </mat-card>
</section>

<ng-template #productFormDialog>
  <div class="modal-shell">
    <div class="modal-header">
      <h2>{{ editingId ? 'Editar Produto' : 'Novo Produto' }}</h2>
      <button mat-icon-button type="button" (click)="resetForm()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Preco de venda</mat-label>
        <input matInput type="number" formControlName="salePrice" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descricao</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estoque</mat-label>
        <input matInput type="number" formControlName="stock" />
      </mat-form-field>

      <div class="actions-row">
        <button mat-flat-button color="primary" type="button" (click)="save()">
          {{ editingId ? 'Atualizar' : 'Salvar' }}
        </button>
        <button mat-stroked-button type="button" (click)="resetForm()">Cancelar</button>
      </div>
    </form>
  </div>
</ng-template>
