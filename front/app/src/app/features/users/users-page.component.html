<section class="page-grid">
  <mat-card>
    <div class="card-header">
      <h2>Lista de Usuarios</h2>
      <button mat-flat-button color="primary" type="button" (click)="openCreateModal()">Novo Usuario</button>
    </div>

    <div class="table-filters">
      <mat-form-field appearance="outline">
        <mat-label>Buscar usuario</mat-label>
        <input
          matInput
          [(ngModel)]="filterTerm"
          (input)="onFilterChange()"
          placeholder="Nome, e-mail ou perfil"
        />
      </mat-form-field>

      <button class="filter-clear-btn" mat-stroked-button type="button" (click)="clearFilter()">Limpar</button>
    </div>

    <table mat-table [dataSource]="users" class="table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Perfil</th>
        <td mat-cell *matCellDef="let row">{{ row.role }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acoes</th>
        <td mat-cell *matCellDef="let row">
          <button *ngIf="canDeleteUser(row)" mat-icon-button color="warn" (click)="remove(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">Nenhum item encontrado.</td>
      </tr>
    </table>
  </mat-card>
</section>

<ng-template #userFormDialog>
  <div class="modal-shell">
    <div class="modal-header">
      <h2>Novo Usuario</h2>
      <button mat-icon-button type="button" [mat-dialog-close]="true">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Perfil</mat-label>
        <mat-select formControlName="role">
          <mat-option value="USER">USER</mat-option>
          <mat-option value="ADMIN">ADMIN</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="actions-row">
        <button mat-flat-button color="primary" type="button" (click)="save()">Salvar</button>
        <button mat-stroked-button type="button" [mat-dialog-close]="true">Cancelar</button>
      </div>
    </form>
  </div>
</ng-template>
